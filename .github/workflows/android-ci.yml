name: Hermex-Type-J Android CI

on:
  push:
    branches: [master, main]
    paths: ['android/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:

jobs:
  build:
    name: Build & test Hermex-Type-J
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and Android Lint
        timeout-minutes: 12
        run: |
          cat > "$RUNNER_TEMP/trace-tests.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  testLogging {
                      events 'started', 'passed', 'skipped', 'failed'
                      showStandardStreams = true
                  }
              }
          }
          GRADLE
          (
              sleep 360
              for pid in $(jps -q); do
                  jcmd "$pid" Thread.print -l || true
              done
          ) &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
          ./gradlew --no-daemon --console=plain --init-script "$RUNNER_TEMP/trace-tests.gradle" :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermex-type-j-android-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
